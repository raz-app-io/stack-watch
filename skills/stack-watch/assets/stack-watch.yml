# stack-watch scheduled probe.
#
# Copy this file to .github/workflows/stack-watch.yml in your repo after the
# first bootstrap (it needs stack-watch/sources.json). Every Monday it runs
# the deterministic half of a probe with no AI involved and, when there is
# anything new, opens one issue labeled "stack-watch" (or comments on the
# open one) with a digest. Classify and ticket by running /stack-watch in
# Claude Code; the ledger is only written by that run, so the issue keeps
# listing an item until someone decides on it.
#
# STACK_WATCH_REF pins the stack-watch release the job runs; bump it on purpose.
# The actions below are pinned to commit SHAs; Dependabot can keep them current.

name: stack-watch

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  STACK_WATCH_REF: v1.3.1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch stack-watch
        run: git clone --depth 1 --branch "$STACK_WATCH_REF" https://github.com/raz-app-io/stack-watch.git /tmp/stack-watch

      - name: Probe
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/probe
          # headless.py never runs the repo's package manager and fetches http(s) only;
          # add --allow-private-hosts only for self-hosted vendors on a self-hosted runner.
          python3 /tmp/stack-watch/skills/stack-watch/scripts/headless.py . --out /tmp/probe --pretty > /tmp/probe/summary.json
          code=$?
          cat /tmp/probe/summary.json
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Open or update the stack-watch issue
        if: steps.probe.outputs.exit == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create stack-watch --description "Vendor changes found by stack-watch" --color 1D76DB --force
          existing=$(gh issue list --label stack-watch --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/probe/digest.md
          else
            gh issue create --title "stack-watch: new vendor items ($(date -u +%F))" --label stack-watch --body-file /tmp/probe/digest.md
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stack-watch-probe
          path: /tmp/probe
          retention-days: 30
